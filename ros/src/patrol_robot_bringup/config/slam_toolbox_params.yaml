# 文件用途：SLAM Toolbox 建图参数（online_async 模式）
# 契约与调参建议见 docs/04-详细设计说明书.md §10.2
slam_toolbox:
  ros__parameters:
    # ---- 求解器 ----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI

    # ---- 坐标系与话题 ----
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping                 # mapping | localization

    # ---- 关键帧策略（建图速度与精度的折中）----
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3  # 移动超过 0.3 m 才插入新关键帧
    minimum_travel_heading: 0.3   # 转动超过 0.3 rad 才插入新关键帧
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # ---- 回环检测 ----
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- 地图 ----
    resolution: 0.05              # 5 cm/格，与 Nav2 保持一致
    max_laser_range: 3.5          # 必须 >= LiDAR 有效量程
    minimum_laser_range: 0.12     # 与 TB3 LiDAR 最小量程一致，避免启动告警
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # ---- 其他 ----
    enable_interactive_mode: true # 允许 RViz 中手动校正位姿
    debug_logging: false
    throttle_scans: 1
    publish_period: 0.5
